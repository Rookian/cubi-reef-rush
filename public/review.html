<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cubi's Reef Rush – Design review</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root { --ink: #12324A; --sun: #FFD23F; }
* { box-sizing: border-box; } html, body { margin: 0; height: 100%; font-family: Fredoka, system-ui, sans-serif; color: var(--ink); background: #2C93C4; }
#wrap { display: grid; grid-template-columns: 250px 1fr; height: 100%; }
#list { overflow-y: auto; background: rgba(255,255,255,.9); border-right: 4px solid var(--ink); padding: 8px; display: flex; flex-direction: column; gap: 4px; }
#list button { text-align: left; font: 600 15px Fredoka, sans-serif; color: var(--ink); background: #fff; border: 2px solid transparent; border-radius: 10px; padding: 7px 9px; cursor: pointer; }
#list button.on { border-color: var(--ink); background: var(--sun); }
#stage { position: relative; min-width: 0; } canvas { width: 100%; height: 100%; display: block; touch-action: none; }
#top { position: absolute; top: 14px; left: 0; right: 0; text-align: center; pointer-events: none; }
#name { margin: 0; font-size: 34px; font-weight: 700; color: #fff; -webkit-text-stroke: 6px var(--ink); paint-order: stroke fill; }
#de { font-size: 19px; font-weight: 600; color: #fff; -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; }
#bar { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); width: min(680px, 94%); background: rgba(255,255,255,.93); border: 4px solid var(--ink); border-radius: 22px; padding: 12px; display: grid; gap: 8px; }
.row { display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap; }
button.b { font: 700 17px Fredoka, sans-serif; color: var(--ink); background: #fff; border: 3px solid var(--ink); border-radius: 999px; padding: 8px 18px; min-height: 44px; cursor: pointer; box-shadow: 0 3px 0 var(--ink); }
#ok[aria-pressed="true"] { background: #8EDB7A; } #no[aria-pressed="true"] { background: #FFB36B; } #copy { background: var(--sun); }
textarea { width: 100%; font: 500 16px Fredoka, sans-serif; border: 3px solid var(--ink); border-radius: 14px; padding: 8px 12px; min-height: 52px; resize: vertical; color: var(--ink); }
#count { font-weight: 700; min-width: 70px; text-align: center; } .hint { font-size: 14px; text-align: center; color: #3D5A70; }
#list h2 { margin: 12px 4px 2px; font-size: 16px; } #list h2 small { display: block; font-size: 12px; font-weight: 500; color: #3D5A70; }
#list button.gal, #galTop { font: 700 15px Fredoka, sans-serif; background: var(--sun); border: 3px solid var(--ink); border-radius: 12px; padding: 8px; box-shadow: 0 3px 0 var(--ink); cursor: pointer; color: var(--ink); }
#galTop { position: absolute; top: 14px; left: 14px; z-index: 2; }
#gallery { display: none; position: fixed; inset: 0; overflow-y: auto; background: linear-gradient(#8EE4F8, #2C93C4 420px, #1F6FA8); z-index: 10; padding: 18px 22px 40px; }
body.galOn #gallery { display: block; } body.galOn #wrap { visibility: hidden; }
.ghead { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.ghead h1 { margin: 0; font-size: 30px; color: #fff; -webkit-text-stroke: 6px var(--ink); paint-order: stroke fill; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px -22px 4px; position: sticky; top: -18px; padding: 10px 22px; z-index: 1; background: rgba(142,228,248,.92); border-bottom: 3px solid var(--ink); }
.chips a { font: 600 15px Fredoka, sans-serif; color: var(--ink); background: #fff; border: 3px solid var(--ink); border-radius: 999px; padding: 6px 14px; text-decoration: none; box-shadow: 0 3px 0 var(--ink); }
.chips a b { color: #2C7A3A; margin-left: 4px; }
#gallery section { scroll-margin-top: 120px; } #gallery h2 { color: #fff; -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill; font-size: 24px; margin: 22px 0 10px; }
#gallery h2 small { font-size: 16px; -webkit-text-stroke: 3px var(--ink); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
.card { position: relative; display: flex; flex-direction: column; align-items: stretch; text-align: left; font-family: Fredoka, sans-serif; color: var(--ink); background: #fff; border: 3px solid var(--ink); border-radius: 18px; padding: 0 0 10px; overflow: hidden; cursor: pointer; box-shadow: 0 4px 0 var(--ink); transition: transform .12s; }
.card:hover, .card:focus-visible { transform: translateY(-3px); outline: none; } .card:focus-visible { border-color: #FF8A00; }
.card .pic { display: block; aspect-ratio: 4 / 3; background: linear-gradient(#9AF0FF, #1A7EC2); border-bottom: 3px solid var(--ink); }
.card .pic img { width: 100%; height: 100%; display: block; object-fit: cover; }
.card .wait { display: block; width: 26px; height: 26px; margin: 34% auto 0; border: 4px solid rgba(255,255,255,.5); border-top-color: #fff; border-radius: 50%; animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.card b { font-size: 16px; padding: 8px 10px 0; line-height: 1.15; } .card small { font-size: 13px; color: #3D5A70; padding: 2px 10px 0; }
.card .no { position: absolute; top: 8px; left: 8px; background: var(--sun); border: 2px solid var(--ink); border-radius: 999px; font-weight: 700; font-size: 13px; padding: 1px 8px; }
.card .st { position: absolute; top: 6px; right: 8px; font-size: 18px; }
@media (max-width: 760px) { #wrap { grid-template-columns: 1fr; grid-template-rows: 1fr; } #list { display: none; } #name { font-size: 26px; } }
</style></head><body>
<div id="wrap"><nav id="list" aria-label="All designs"></nav>
<main id="stage"><canvas id="c"></canvas>
  <button id="galTop">▦ Gallery</button>
  <div id="top"><h1 id="name"></h1><div id="de"></div></div>
  <div id="bar">
    <div class="row"><button class="b" id="prev" aria-label="Previous">◀</button><span id="count"></span><button class="b" id="next" aria-label="Next">▶</button>
      <button class="b" id="ok" aria-pressed="false">👍 Accept</button><button class="b" id="no" aria-pressed="false">✏️ Needs changes</button></div>
    <label><textarea id="note" placeholder="What should change? (shape, colours, face, movement …)" aria-label="Feedback for this design"></textarea></label>
    <div class="row"><button class="b" id="copy">Copy my feedback</button></div>
    <div class="hint">Drag to look around, scroll to zoom. Your notes are saved in this browser.</div>
  </div></main></div>
<div id="gallery" aria-label="All designs as pictures"></div>
<script src="review.js?v=mwtf6wnf"></script></body></html>
